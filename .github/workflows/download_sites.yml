name: Download Sites

"on":
  schedule:
    - cron: '0 6 * * *'   # 6h UTC  = 3h Brasília (horário de verão) / madrugada
    - cron: '0 18 * * *'  # 18h UTC = 15h Brasília — tarde, fora do horário de pico
  workflow_dispatch:
    inputs:
      max_sites:
        description: 'Número máximo de sites a processar (1-3)'
        required: false
        default: '3'

permissions:
  contents: write

jobs:
  # ── JOB 1: Seleciona próximas URLs ─────────────────────────────────────────
  prepare:
    name: Preparar lista de URLs
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.select.outputs.urls }}
      has_urls: ${{ steps.select.outputs.has_urls }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Selecionar próximas URLs
        id: select
        shell: python
        run: |
          import json, os

          max_sites = int("${{ github.event.inputs.max_sites || '3' }}")
          max_sites = max(1, min(3, max_sites))

          pending = []
          try:
              with open("sites.txt", encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith("#"):
                          pending.append(line)
          except FileNotFoundError:
              print("AVISO: sites.txt não encontrado")

          processed = set()
          try:
              with open("processed_urls.txt", encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith("#"):
                          processed.add(line)
          except FileNotFoundError:
              pass

          to_process = [u for u in pending if u not in processed][:max_sites]

          print(f"Sites no arquivo: {len(pending)}")
          print(f"Já processados:   {len(processed)}")
          print(f"Fila restante:    {len([u for u in pending if u not in processed])}")
          print(f"Selecionados agora: {len(to_process)}")
          for u in to_process:
              print(f"  → {u}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"urls={json.dumps(to_process)}\n")
              fh.write(f"has_urls={'true' if to_process else 'false'}\n")

  # ── JOB 2: Baixa cada site em paralelo ────────────────────────────────────
  download:
    name: Baixar ${{ matrix.url }}
    needs: prepare
    if: needs.prepare.outputs.has_urls == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        url: ${{ fromJson(needs.prepare.outputs.urls) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar wget
        run: sudo apt-get install -y wget

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar site
        id: download
        run: |
          START_TS=$(date +%s)

          URL="${{ matrix.url }}"
          if echo "$URL" | grep -q "gov\.br"; then
            DEPTH=1
          else
            DEPTH=2
          fi

          set +e
          OUTPUT=$(python downloader_cli.py \
            --url "$URL" \
            --dest ./snapshots \
            --depth $DEPTH \
            --wait 1.0 \
            --timeout 18000 \
            2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"

          END_TS=$(date +%s)
          DURATION_S=$((END_TS - START_TS))
          DURATION_MIN=$((DURATION_S / 60))
          DURATION_SEC=$((DURATION_S % 60))
          DURATION_FMT="${DURATION_MIN}m${DURATION_SEC}s"

          SNAP_PATH=$(echo "$OUTPUT" | grep '^SNAPSHOT_PATH=' | cut -d= -f2-)
          PDF_DIR=$(echo "$OUTPUT"   | grep '^PDF_DIR='       | cut -d= -f2-)

          echo "snapshot_path=$SNAP_PATH"   >> "$GITHUB_OUTPUT"
          echo "pdf_dir=$PDF_DIR"           >> "$GITHUB_OUTPUT"
          echo "exit_code=$EXIT_CODE"       >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION_FMT"     >> "$GITHUB_OUTPUT"
          echo "duration_s=$DURATION_S"     >> "$GITHUB_OUTPUT"
          exit 0

      - name: Zipar snapshot completo
        id: zip_snap
        if: steps.download.outputs.snapshot_path != ''
        run: |
          SNAP="${{ steps.download.outputs.snapshot_path }}"
          SNAP_NAME=$(basename "$SNAP")
          DOMAIN=$(basename "$(dirname "$SNAP")")
          ZIP_BASE="${DOMAIN}__${SNAP_NAME}"
          ZIP_NAME="${ZIP_BASE}.zip"
          LIMIT_BYTES=$((1900 * 1024 * 1024))   # 1.9 GB em bytes

          echo "Comprimindo snapshot: $SNAP"
          cd snapshots
          zip -r "../${ZIP_NAME}" "$DOMAIN/$SNAP_NAME"
          cd ..

          ZIP_BYTES=$(stat -c%s "$ZIP_NAME")
          ZIP_SIZE=$(du -sh "$ZIP_NAME" | cut -f1)
          echo "Tamanho do zip: $ZIP_SIZE ($ZIP_BYTES bytes)"

          if [ "$ZIP_BYTES" -gt "$LIMIT_BYTES" ]; then
            # Arquivo maior que 1.9 GB → divide em partes de 1800 MB
            echo "ZIP > 1.9 GB, dividindo em partes de 1800 MB..."
            mkdir -p zip_parts
            zip -r -s 1800m "zip_parts/${ZIP_BASE}.zip" "snapshots/$DOMAIN/$SNAP_NAME"
            # Lista todas as partes geradas (z01, z02... + .zip final)
            PARTS=$(ls zip_parts/${ZIP_BASE}.z?? zip_parts/${ZIP_BASE}.zip 2>/dev/null | tr '\n' ' ')
            PART_COUNT=$(echo "$PARTS" | wc -w)
            echo "Partes geradas: $PART_COUNT → $PARTS"
            echo "zip_name="          >> "$GITHUB_OUTPUT"   # zip único não existe
            echo "zip_parts=$PARTS"   >> "$GITHUB_OUTPUT"
            echo "zip_size=$ZIP_SIZE" >> "$GITHUB_OUTPUT"
            echo "split=true"         >> "$GITHUB_OUTPUT"
            rm -f "$ZIP_NAME"
          else
            echo "zip_name=$ZIP_NAME"   >> "$GITHUB_OUTPUT"
            echo "zip_parts="           >> "$GITHUB_OUTPUT"
            echo "zip_size=$ZIP_SIZE"   >> "$GITHUB_OUTPUT"
            echo "split=false"          >> "$GITHUB_OUTPUT"
          fi

      - name: Zipar PDFs
        id: zip_pdfs
        if: steps.download.outputs.pdf_dir != ''
        run: |
          PDF_DIR="${{ steps.download.outputs.pdf_dir }}"
          SNAP="${{ steps.download.outputs.snapshot_path }}"
          DOMAIN=$(basename "$(dirname "$SNAP")")
          SNAP_NAME=$(basename "$SNAP")
          PDF_ZIP_BASE="${DOMAIN}__${SNAP_NAME}__PDFs"
          PDF_ZIP_NAME="${PDF_ZIP_BASE}.zip"
          LIMIT_BYTES=$((1900 * 1024 * 1024))   # 1.9 GB em bytes

          PDF_COUNT=$(find "$PDF_DIR" -name "*.pdf" | wc -l)
          echo "PDFs encontrados: $PDF_COUNT"

          if [ "$PDF_COUNT" -gt 0 ]; then
            zip -r "$PDF_ZIP_NAME" "$PDF_DIR"
            PDF_ZIP_BYTES=$(stat -c%s "$PDF_ZIP_NAME")
            PDF_ZIP_SIZE=$(du -sh "$PDF_ZIP_NAME" | cut -f1)
            echo "Tamanho do PDF zip: $PDF_ZIP_SIZE ($PDF_ZIP_BYTES bytes)"

            if [ "$PDF_ZIP_BYTES" -gt "$LIMIT_BYTES" ]; then
              echo "PDF ZIP > 1.9 GB, dividindo em partes de 1800 MB..."
              mkdir -p zip_parts
              zip -r -s 1800m "zip_parts/${PDF_ZIP_BASE}.zip" "$PDF_DIR"
              PDF_PARTS=$(ls zip_parts/${PDF_ZIP_BASE}.z?? zip_parts/${PDF_ZIP_BASE}.zip 2>/dev/null | tr '\n' ' ')
              PDF_PART_COUNT=$(echo "$PDF_PARTS" | wc -w)
              echo "Partes de PDF geradas: $PDF_PART_COUNT → $PDF_PARTS"
              echo "pdf_zip_name="             >> "$GITHUB_OUTPUT"
              echo "pdf_zip_parts=$PDF_PARTS" >> "$GITHUB_OUTPUT"
              echo "pdf_count=$PDF_COUNT"     >> "$GITHUB_OUTPUT"
              rm -f "$PDF_ZIP_NAME"
            else
              echo "pdf_zip_name=$PDF_ZIP_NAME" >> "$GITHUB_OUTPUT"
              echo "pdf_zip_parts="             >> "$GITHUB_OUTPUT"
              echo "pdf_count=$PDF_COUNT"       >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Nenhum PDF para zipar."
            echo "pdf_zip_name="  >> "$GITHUB_OUTPUT"
            echo "pdf_zip_parts=" >> "$GITHUB_OUTPUT"
            echo "pdf_count=0"    >> "$GITHUB_OUTPUT"
          fi

      - name: Criar/atualizar Release e fazer upload
        id: release
        if: steps.zip_snap.outputs.zip_name != '' || steps.zip_snap.outputs.zip_parts != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="snapshot-$(date -u +%Y-%m-%d)"
          TITLE="Snapshots de $(date -u +%d/%m/%Y)"

          if ! gh release view "$TAG" &>/dev/null; then
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "Snapshots gerados automaticamente em $(date -u +'%d/%m/%Y às %H:%M UTC')." \
              --latest
            echo "Release $TAG criado."
          else
            echo "Release $TAG já existe, adicionando assets."
          fi

          # Upload: zip único OU partes divididas
          ZIP_NAME="${{ steps.zip_snap.outputs.zip_name }}"
          ZIP_PARTS="${{ steps.zip_snap.outputs.zip_parts }}"

          if [ -n "$ZIP_NAME" ] && [ -f "$ZIP_NAME" ]; then
            gh release upload "$TAG" "$ZIP_NAME" --clobber
            echo "Snapshot enviado: $ZIP_NAME"
          elif [ -n "$ZIP_PARTS" ]; then
            echo "Enviando partes do snapshot (zip dividido)..."
            for PART in $ZIP_PARTS; do
              if [ -f "$PART" ]; then
                gh release upload "$TAG" "$PART" --clobber
                echo "  Parte enviada: $PART"
              fi
            done
          fi

          # Upload do zip de PDFs (único ou dividido)
          PDF_ZIP="${{ steps.zip_pdfs.outputs.pdf_zip_name }}"
          PDF_PARTS="${{ steps.zip_pdfs.outputs.pdf_zip_parts }}"
          if [ -n "$PDF_ZIP" ] && [ -f "$PDF_ZIP" ]; then
            gh release upload "$TAG" "$PDF_ZIP" --clobber
            echo "PDFs enviados: $PDF_ZIP"
          elif [ -n "$PDF_PARTS" ]; then
            echo "Enviando partes do PDF zip (zip dividido)..."
            for PART in $PDF_PARTS; do
              if [ -f "$PART" ]; then
                gh release upload "$TAG" "$PART" --clobber
                echo "  Parte enviada: $PART"
              fi
            done
          fi

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"                 >> "$GITHUB_OUTPUT"

      - name: Gerar linha de histórico
        if: always() && steps.download.outputs.duration != ''
        shell: python
        run: |
          from datetime import datetime, timezone

          url          = "${{ matrix.url }}"
          exit_code    = "${{ steps.download.outputs.exit_code }}"
          duration     = "${{ steps.download.outputs.duration }}"
          duration_s   = int("${{ steps.download.outputs.duration_s }}" or "0")
          pdf_count    = "${{ steps.zip_pdfs.outputs.pdf_count }}"   or "0"
          zip_size     = "${{ steps.zip_snap.outputs.zip_size }}"    or "—"
          split        = "${{ steps.zip_snap.outputs.split }}"       == "true"
          release_url  = "${{ steps.release.outputs.release_url }}"  or ""
          tag          = "${{ steps.release.outputs.tag }}"          or ""

          TIMEOUT_THRESHOLD = 17900  # 5h = 18000s, flag a partir de 17900s
          timed_out = duration_s >= TIMEOUT_THRESHOLD

          if timed_out:
              status = "⚠️ Parcial (timeout 5h)"
          elif exit_code == "0":
              status = "✅ OK"
          else:
              status = "❌ Falhou"

          if split:
              zip_size = zip_size + " ⚡dividido"

          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M")
          snap_link = f"[{tag}]({release_url})" if release_url else "—"

          row = f"| {now} | `{url}` | {status} | {duration} | {snap_link} | {pdf_count} PDFs | {zip_size} |"

          with open("history_row.txt", "w", encoding="utf-8") as f:
              f.write(row)

          # Salva a URL para que update-cursor saiba quais downloads realmente rodaram
          with open("completed_url.txt", "w", encoding="utf-8") as f:
              f.write(url)

          print(f"Linha gerada: {row}")

      - name: Salvar linha de histórico como artifact
        if: always() && steps.download.outputs.duration != ''
        uses: actions/upload-artifact@v4
        with:
          name: history-row-${{ strategy.job-index }}
          path: |
            history_row.txt
            completed_url.txt

  # ── JOB 3: Commit de processed_urls.txt + history.md ──────────────────────
  update-cursor:
    name: Atualizar histórico e cursor
    needs: [prepare, download]
    if: always() && needs.prepare.outputs.has_urls == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar linhas de histórico (artifacts)
        uses: actions/download-artifact@v4
        with:
          pattern: history-row-*
          path: history_rows/
          merge-multiple: false

      - name: Inserir linhas no history.md
        shell: python
        run: |
          import glob

          rows = []
          for path in sorted(glob.glob("history_rows/*/history_row.txt")):
              with open(path, encoding="utf-8") as f:
                  row = f.read().strip()
                  if row:
                      rows.append(row)

          if not rows:
              print("Nenhuma linha de histórico encontrada nos artifacts.")
          else:
              with open("history.md", encoding="utf-8") as f:
                  content = f.read()
              for row in rows:
                  content = content.replace("<!-- HISTORY_ROWS -->", f"{row}\n<!-- HISTORY_ROWS -->")
              with open("history.md", "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"{len(rows)} linha(s) inserida(s) no history.md.")
              for r in rows:
                  print(f"  {r}")

      - name: Adicionar URLs ao cursor
        shell: python
        run: |
          import glob

          # Só adiciona URLs cujo download de fato iniciou (tem completed_url.txt no artifact)
          # Jobs cancelados antes do download não geram esse arquivo.
          completed_urls = []
          for path in sorted(glob.glob("history_rows/*/completed_url.txt")):
              with open(path, encoding="utf-8") as f:
                  url = f.read().strip()
                  if url:
                      completed_urls.append(url)

          if not completed_urls:
              print("Nenhuma URL completada para adicionar ao cursor.")
          else:
              try:
                  with open("processed_urls.txt", encoding="utf-8") as f:
                      content = f.read()
              except FileNotFoundError:
                  content = "# URLs já processadas pelo workflow (atualizado automaticamente pelo CI)\n# NÃO edite manualmente.\n"

              existing = set(
                  line.strip() for line in content.splitlines()
                  if line.strip() and not line.strip().startswith("#")
              )
              new_urls = [u for u in completed_urls if u not in existing]

              if new_urls:
                  with open("processed_urls.txt", "a", encoding="utf-8") as f:
                      for u in new_urls:
                          f.write(f"{u}\n")
                  print(f"Adicionadas {len(new_urls)} URLs ao cursor.")
                  for u in new_urls:
                      print(f"  + {u}")
              else:
                  print("Nenhuma URL nova para adicionar.")

      - name: Commitar processed_urls.txt e history.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_urls.txt history.md
          if git diff --cached --quiet; then
            echo "Nenhuma mudança para commitar."
          else
            git commit -m "ci: atualizar cursor e histórico [skip ci]"
            git push
          fi
