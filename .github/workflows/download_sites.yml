name: Download Sites

"on":
  schedule:
    - cron: '0 6 * * *'   # 6h UTC  = 3h Brasília (horário de verão) / madrugada
    - cron: '0 18 * * *'  # 18h UTC = 15h Brasília — tarde, fora do horário de pico
  workflow_dispatch:
    inputs:
      max_sites:
        description: 'Número máximo de sites a processar (1-3)'
        required: false
        default: '3'

permissions:
  contents: write

jobs:
  # ── JOB 1: Seleciona próximas URLs ─────────────────────────────────────────
  prepare:
    name: Preparar lista de URLs
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.select.outputs.urls }}
      has_urls: ${{ steps.select.outputs.has_urls }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Selecionar próximas URLs
        id: select
        shell: python
        run: |
          import json, os

          max_sites = int("${{ github.event.inputs.max_sites || '3' }}")
          max_sites = max(1, min(3, max_sites))

          pending = []
          try:
              with open("sites.txt", encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith("#"):
                          pending.append(line)
          except FileNotFoundError:
              print("AVISO: sites.txt não encontrado")

          processed = set()
          try:
              with open("processed_urls.txt", encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith("#"):
                          processed.add(line)
          except FileNotFoundError:
              pass

          to_process = [u for u in pending if u not in processed][:max_sites]

          print(f"Sites no arquivo: {len(pending)}")
          print(f"Já processados:   {len(processed)}")
          print(f"Fila restante:    {len([u for u in pending if u not in processed])}")
          print(f"Selecionados agora: {len(to_process)}")
          for u in to_process:
              print(f"  → {u}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"urls={json.dumps(to_process)}\n")
              fh.write(f"has_urls={'true' if to_process else 'false'}\n")

  # ── JOB 2: Baixa cada site em paralelo ────────────────────────────────────
  download:
    name: Baixar ${{ matrix.url }}
    needs: prepare
    if: needs.prepare.outputs.has_urls == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        url: ${{ fromJson(needs.prepare.outputs.urls) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar wget
        run: sudo apt-get install -y wget

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar site
        id: download
        run: |
          START_TS=$(date +%s)

          set +e
          OUTPUT=$(python downloader_cli.py \
            --url "${{ matrix.url }}" \
            --dest ./snapshots \
            --depth 2 \
            --wait 1.0 \
            --timeout 21600 \
            2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"

          END_TS=$(date +%s)
          DURATION_S=$((END_TS - START_TS))
          DURATION_MIN=$((DURATION_S / 60))
          DURATION_SEC=$((DURATION_S % 60))
          DURATION_FMT="${DURATION_MIN}m${DURATION_SEC}s"

          SNAP_PATH=$(echo "$OUTPUT" | grep '^SNAPSHOT_PATH=' | cut -d= -f2-)
          PDF_DIR=$(echo "$OUTPUT"   | grep '^PDF_DIR='       | cut -d= -f2-)

          echo "snapshot_path=$SNAP_PATH"   >> "$GITHUB_OUTPUT"
          echo "pdf_dir=$PDF_DIR"           >> "$GITHUB_OUTPUT"
          echo "exit_code=$EXIT_CODE"       >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION_FMT"     >> "$GITHUB_OUTPUT"
          echo "duration_s=$DURATION_S"     >> "$GITHUB_OUTPUT"
          exit 0

      - name: Zipar snapshot completo
        id: zip_snap
        if: steps.download.outputs.snapshot_path != ''
        run: |
          SNAP="${{ steps.download.outputs.snapshot_path }}"
          SNAP_NAME=$(basename "$SNAP")
          DOMAIN=$(basename "$(dirname "$SNAP")")
          ZIP_NAME="${DOMAIN}__${SNAP_NAME}.zip"

          echo "Comprimindo snapshot: $SNAP → $ZIP_NAME"
          cd snapshots
          zip -r "../$ZIP_NAME" "$DOMAIN/$SNAP_NAME"
          cd ..

          ZIP_SIZE=$(du -sh "$ZIP_NAME" | cut -f1)
          ZIP_BYTES=$(stat -c%s "$ZIP_NAME")

          echo "zip_name=$ZIP_NAME"   >> "$GITHUB_OUTPUT"
          echo "zip_size=$ZIP_SIZE"   >> "$GITHUB_OUTPUT"
          echo "zip_bytes=$ZIP_BYTES" >> "$GITHUB_OUTPUT"

      - name: Zipar PDFs
        id: zip_pdfs
        if: steps.download.outputs.pdf_dir != ''
        run: |
          PDF_DIR="${{ steps.download.outputs.pdf_dir }}"
          SNAP="${{ steps.download.outputs.snapshot_path }}"
          DOMAIN=$(basename "$(dirname "$SNAP")")
          SNAP_NAME=$(basename "$SNAP")
          PDF_ZIP_NAME="${DOMAIN}__${SNAP_NAME}__PDFs.zip"

          PDF_COUNT=$(find "$PDF_DIR" -name "*.pdf" | wc -l)
          echo "PDFs encontrados: $PDF_COUNT"

          if [ "$PDF_COUNT" -gt 0 ]; then
            zip -r "$PDF_ZIP_NAME" "$PDF_DIR"
            echo "pdf_zip_name=$PDF_ZIP_NAME" >> "$GITHUB_OUTPUT"
            echo "pdf_count=$PDF_COUNT"       >> "$GITHUB_OUTPUT"
          else
            echo "Nenhum PDF para zipar."
            echo "pdf_zip_name=" >> "$GITHUB_OUTPUT"
            echo "pdf_count=0"   >> "$GITHUB_OUTPUT"
          fi

      - name: Criar/atualizar Release e fazer upload
        id: release
        if: steps.zip_snap.outputs.zip_name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="snapshot-$(date -u +%Y-%m-%d)"
          TITLE="Snapshots de $(date -u +%d/%m/%Y)"

          if ! gh release view "$TAG" &>/dev/null; then
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "Snapshots gerados automaticamente em $(date -u +'%d/%m/%Y às %H:%M UTC')." \
              --latest
            echo "Release $TAG criado."
          else
            echo "Release $TAG já existe, adicionando assets."
          fi

          gh release upload "$TAG" "${{ steps.zip_snap.outputs.zip_name }}" --clobber
          echo "Snapshot enviado: ${{ steps.zip_snap.outputs.zip_name }}"

          PDF_ZIP="${{ steps.zip_pdfs.outputs.pdf_zip_name }}"
          if [ -n "$PDF_ZIP" ] && [ -f "$PDF_ZIP" ]; then
            gh release upload "$TAG" "$PDF_ZIP" --clobber
            echo "PDFs enviados: $PDF_ZIP"
          fi

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"                 >> "$GITHUB_OUTPUT"

      - name: Registrar resultado no history.md
        if: always() && steps.download.outputs.duration != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import json, os, re
          from datetime import datetime, timezone

          url          = "${{ matrix.url }}"
          exit_code    = "${{ steps.download.outputs.exit_code }}"
          duration     = "${{ steps.download.outputs.duration }}"
          pdf_count    = "${{ steps.zip_pdfs.outputs.pdf_count }}"   or "0"
          zip_size     = "${{ steps.zip_snap.outputs.zip_size }}"    or "—"
          release_url  = "${{ steps.release.outputs.release_url }}"  or ""
          tag          = "${{ steps.release.outputs.tag }}"          or ""

          status = "✅ OK" if exit_code == "0" else "❌ Falhou"
          now    = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M")

          if release_url:
              snap_link = f"[{tag}]({release_url})"
          else:
              snap_link = "—"

          row = f"| {now} | `{url}` | {status} | {duration} | {snap_link} | {pdf_count} PDFs | {zip_size} |"

          try:
              with open("history.md", encoding="utf-8") as f:
                  content = f.read()
          except FileNotFoundError:
              content = "# 📋 Histórico de Execuções\n\n| Data/Hora (UTC) | Site | Status | Duração | Snapshot | PDFs | Tamanho |\n|---|---|---|---|---|---|---|\n<!-- HISTORY_ROWS -->\n"

          # Insere a nova linha logo após o cabeçalho da tabela (antes de <!-- HISTORY_ROWS -->)
          updated = content.replace("<!-- HISTORY_ROWS -->", f"{row}\n<!-- HISTORY_ROWS -->")

          with open("history.md", "w", encoding="utf-8") as f:
              f.write(updated)

          print(f"Linha adicionada ao history.md: {row}")

  # ── JOB 3: Commit de processed_urls.txt + history.md ──────────────────────
  update-cursor:
    name: Atualizar histórico e cursor
    needs: [prepare, download]
    if: always() && needs.prepare.outputs.has_urls == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Busca o estado mais recente (download jobs podem ter feito push do history.md)
          fetch-depth: 0

      - name: Pull para pegar history.md atualizado
        run: git pull --rebase origin master || git pull --rebase origin main || true

      - name: Adicionar URLs ao cursor
        shell: python
        run: |
          import json

          urls = json.loads('${{ needs.prepare.outputs.urls }}')

          try:
              with open("processed_urls.txt", encoding="utf-8") as f:
                  content = f.read()
          except FileNotFoundError:
              content = "# URLs já processadas pelo workflow (atualizado automaticamente pelo CI)\n# NÃO edite manualmente.\n"

          existing = set(
              line.strip() for line in content.splitlines()
              if line.strip() and not line.strip().startswith("#")
          )
          new_urls = [u for u in urls if u not in existing]

          if new_urls:
              with open("processed_urls.txt", "a", encoding="utf-8") as f:
                  for u in new_urls:
                      f.write(f"{u}\n")
              print(f"Adicionadas {len(new_urls)} URLs ao cursor.")
              for u in new_urls:
                  print(f"  + {u}")
          else:
              print("Nenhuma URL nova para adicionar.")

      - name: Commitar processed_urls.txt e history.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_urls.txt history.md
          if git diff --cached --quiet; then
            echo "Nenhuma mudança para commitar."
          else
            git commit -m "ci: atualizar cursor e histórico [skip ci]"
            git push
          fi
